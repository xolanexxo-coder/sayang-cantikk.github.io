<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>untuk sayangku yang cantik ❤️</title>

  <link rel="stylesheet" href="style.css" />

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
        "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.152.2/examples/jsm/controls/OrbitControls.js",
        "three/examples/jsm/loaders/FontLoader.js": "https://unpkg.com/three@0.152.2/examples/jsm/loaders/FontLoader.js",
        "three/examples/jsm/geometries/TextGeometry.js": "https://unpkg.com/three@0.152.2/examples/jsm/geometries/TextGeometry.js"
      }
    }
  </script>

  <style>
    #musicButton {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 20px;

      background-color: #ffffff10;
      color: white;

      border: 1px solid white;
      border-radius: 8px;

      cursor: pointer;
      z-index: 9999;

      font-weight: bold;

      backdrop-filter: blur(5px);
    }

    #musicButton:hover {
      background-color: #ffffff30;
    }
  </style>

</head>

<body>

  <!-- CONTAINER -->
  <div id="container"></div>


  <!-- LANDSCAPE WARNING -->
  <div id="landscape-warning">

    <div class="warning-content">

      <div class="rotate-icon"></div>

      <h1>Stellar Bloom</h1>

      <h1>Tinh Cầu</h1>

      <div class="stars-bg"></div>

    </div>

  </div>


  <!-- OVERLAY -->
  <div id="dark-overlay"></div>

  <div id="info"></div>


  <!-- TEKS BAWAH -->
  <h1
    style="
      position: fixed;
      bottom: 10px;
      right: 10px;
      font-size: 18px;
      font-family: Arial, sans-serif;
      color: white;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 12px;
      border-radius: 8px;
      z-index: 9999;
    "
  >

    Create by Iyan For Sayang ❤️

  </h1>


  <!-- MUSIK -->
  <audio id="music" loop preload="auto">

    <source src="bruno.mp3" type="audio/mpeg">

    Browser kamu tidak mendukung audio.

  </audio>


  <!-- TOMBOL MUSIK -->
  <button id="musicButton">

    Mainkan Musik 🎵

  </button>


  <!-- SCRIPT MUSIK -->
  <script>

    const music = document.getElementById("music");

    const musicButton =
      document.getElementById("musicButton");


    musicButton.addEventListener("click", function () {

      music.play();

      musicButton.style.display = "none";

    });

  </script>


  <!-- SCRIPT UTAMA -->
  <script
    type="module"
    src="script.js">
  </script>


</body>
</html>
